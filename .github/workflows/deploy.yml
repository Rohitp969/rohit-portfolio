# Builds the Vite site and publishes dist/ to GitHub Pages on every push to main.
# Recommended one-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The site is served from https://<user>.github.io/<repo>/, so assets need that prefix.
      - run: npm run build -- --base=/${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Pages is still set to "Deploy from a branch", GitHub also publishes the raw
      # repository files for every push. Wait for that run to finish so the built site
      # below is published last and stays live. With Source set to "GitHub Actions"
      # there is no such run and this step ends immediately.
      - name: Wait for GitHub's branch deployment to finish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 30); do
            pending=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=50" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length')
            if [ "$pending" = "0" ]; then
              echo "No branch deployment in progress."
              break
            fi
            echo "Branch deployment still running, waiting... ($attempt)"
            sleep 10
          done

      - id: deployment
        uses: actions/deploy-pages@v4
